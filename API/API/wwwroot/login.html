<body data-page="login">
    <main class="auth">
        <a class="brand" href="login.html"><span class="brand__logo" aria-hidden="true"></span>Web_name</a>

        <section class="card" aria-labelledby="login-title">
            <h1 class="form-title" id="login-title">Login</h1>
            <p class="form-intro">New here? Use the temporary password we sent to your email. You'll choose your own password right after.</p>

            <!-- JS: show this when the user/password is wrong -->
            <p class="form-error" id="login-error" role="alert" hidden>Wrong user or password.</p>

            <form id="login-form" action="my_space.html" method="get">
                <div class="form-row">
                    <label for="user">User</label>
                    <input id="user" name="user" type="text" class="input" autocomplete="username" required>
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" class="input" autocomplete="current-password" required>
                </div>
                <div class="actions actions--end">
                    <button class="btn btn--primary" type="submit">Enter</button>
                </div>
            </form>
        </section>
    </main>
</body>
