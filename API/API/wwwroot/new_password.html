<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New password | Web_name</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<!--
    Used in two cases:
    1. First login with the temporary password from the email -> must set a new one.
    2. From the profile page ("Change password").
    JS: hide #cancel-link in case 1, since the user has to set a password to continue.
-->
<body data-page="new_password">
    <main class="auth">
        <a class="brand" href="login.html"><span class="brand__logo" aria-hidden="true"></span>Web_name</a>

        <section class="card" aria-labelledby="pw-title">
            <h1 class="form-title" id="pw-title">Create new password</h1>
            <p class="form-intro">Choose a password with at least 8 characters.</p>

            <!-- JS: show when the passwords don't match or are too short -->
            <p class="form-error" id="password-error" role="alert" hidden>The passwords don't match.</p>

            <form id="new-password-form" action="my_space.html" method="get">
                <div class="form-row">
                    <label for="new-password">New password</label>
                    <input id="new-password" name="newPassword" type="password" class="input" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-row">
                    <label for="confirm-password">Confirm password</label>
                    <input id="confirm-password" name="confirmPassword" type="password" class="input" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="actions actions--end">
                    <a class="btn" id="cancel-link" href="profile.html">Cancel</a>
                    <button class="btn btn--primary" type="submit">Submit</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
