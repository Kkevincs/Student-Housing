<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Web_name</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-section="profile">
    <div id="header"></div>

    <main class="page" style="max-width: 820px;">
        <section class="card">
            <div class="profile-head">
                <span class="avatar avatar--lg" id="profile-avatar" aria-hidden="true">AR</span>
                <div class="profile-head__info">
                    <h1 class="profile-head__name" id="profile-name">Anna Rossi</h1>
                    <p class="profile-head__email" id="profile-email">anna@example.com</p>
                </div>
                <button class="btn" type="button" id="edit-profile">Edit</button>
            </div>

            <div class="profile-body">
                <!-- Example values: JS will fill these -->
                <dl class="details">
                    <div><dt>First name</dt><dd id="profile-first-name">Anna</dd></div>
                    <div><dt>Last name</dt><dd id="profile-last-name">Rossi</dd></div>
                    <div><dt>Age</dt><dd id="profile-age">21</dd></div>
                    <div><dt>House</dt><dd id="profile-house">House 1</dd></div>
                    <div><dt>Room</dt><dd id="profile-room">3</dd></div>
                </dl>

                <div class="stack">
                    <section class="card card--muted">
                        <h2 class="stat__label">Streak</h2>
                        <p class="stat__value"><span aria-hidden="true">🔥</span><span id="profile-streak">0</span> weeks</p>
                    </section>
                    <section class="card card--muted">
                        <h2 class="stat__label">Points</h2>
                        <p class="stat__value" id="profile-points">0</p>
                    </section>
                </div>
            </div>

            <div class="profile-footer">
                <a class="btn" href="new_password.html">Change password</a>
                <a class="btn btn--danger" href="login.html" id="logout">Log out</a>
            </div>
        </section>
    </main>

    <script src="include.js"></script>
</body>
</html>
