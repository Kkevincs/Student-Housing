# Local development only. `docker compose up` merges this file automatically;
# Dokploy runs with `-f docker-compose.yml`, so it never loads it.
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"   # for Visual Studio / local tools
  api:
    ports:
      - "${API_PORT:-8080}:8080"
  phpmyadmin:
    ports:
      - "${PMA_PORT:-8082}:80"
