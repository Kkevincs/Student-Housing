# No host ports here: on Dokploy, traffic goes through Domains (Traefik).
# For local use, docker-compose.override.yml (loaded automatically) adds them.
services:
  # MySQL database
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ASP.NET Core API (the image applies EF Core migrations on start, then runs the API)
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    image: student-housing-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DB_CONNECTION: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};
      JWT_KEY: ${JWT_KEY}
      API_BASE_URL: ${API_BASE_URL}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  # Web UI for the database (like phpMyAdmin locally)
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
